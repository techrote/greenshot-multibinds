name: PR validation

on:
  pull_request:
  push:
    branches:
      - 'feature/**'

jobs:
  build-test:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build test dependency graph
        shell: cmd
        run: msbuild src\Greenshot.Tests\Greenshot.Tests.csproj /restore /t:Build /p:Configuration=Debug /v:minimal

      - name: Run tests
        shell: cmd
        run: dotnet test src\Greenshot.Tests\Greenshot.Tests.csproj -c Debug --no-build --logger "console;verbosity=normal"
